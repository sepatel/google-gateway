services:
  gmail-gateway:
    build: .
    image: gmail-gateway:latest
    container_name: gmail-gateway
    restart: unless-stopped
    # Values come from the shell or from a .env file next to this one.
    environment:
      GMAIL_GATEWAY_GOOGLE_CLIENT_ID: ${GMAIL_GATEWAY_GOOGLE_CLIENT_ID:?}
      GMAIL_GATEWAY_GOOGLE_CLIENT_SECRET: ${GMAIL_GATEWAY_GOOGLE_CLIENT_SECRET:?}
      GMAIL_GATEWAY_PUBLIC_URL: ${GMAIL_GATEWAY_PUBLIC_URL:-http://localhost:47613}
      GMAIL_GATEWAY_CLIENTS: ${GMAIL_GATEWAY_CLIENTS:?}
      GMAIL_GATEWAY_ENCRYPTION_KEY: ${GMAIL_GATEWAY_ENCRYPTION_KEY:?}
    volumes:
      - ./data:/data
    ports:
      # Localhost only: locally the browser reaches it directly, and on a server a reverse proxy terminates TLS in front of it.
      - "127.0.0.1:47613:47613"
