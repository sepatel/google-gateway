[package]
name = "gmail-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "warn"
manual_let_else = "warn"
